name: Daily Creator Network
on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'
permissions:
  contents: read
concurrency:
  group: creator-network-daily
  cancel-in-progress: false
jobs:
  operate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Preflight and operate fail-closed
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          WEEKLY_EMAIL_ENDPOINT: ${{ secrets.WEEKLY_EMAIL_ENDPOINT }}
          WEEKLY_EMAIL_TOKEN: ${{ secrets.WEEKLY_EMAIL_TOKEN }}
          WEEKLY_OWNER_EMAIL: ${{ secrets.WEEKLY_OWNER_EMAIL }}
          WEEKLY_REPORT_FROM: ${{ secrets.WEEKLY_REPORT_FROM }}
          WEEKLY_REPORT_DELIVERY_ENABLED: ${{ vars.WEEKLY_REPORT_DELIVERY_ENABLED }}
          OPENROUTER_GENERATION_MODEL: ${{ vars.OPENROUTER_GENERATION_MODEL }}
          OPENROUTER_QA_MODEL: ${{ vars.OPENROUTER_QA_MODEL }}
          OPENROUTER_HIGH_STAKES_MODEL: ${{ vars.OPENROUTER_HIGH_STAKES_MODEL }}
          AUTONOMOUS_RUNTIME_WIRED: ${{ vars.AUTONOMOUS_RUNTIME_WIRED }}
          DURABLE_STATE_CONFIGURED: ${{ vars.DURABLE_STATE_CONFIGURED }}
          CREATOR_STATE_API_URL: ${{ vars.CREATOR_STATE_API_URL }}
          CREATOR_STATE_API_TOKEN: ${{ secrets.CREATOR_STATE_API_TOKEN }}
          LIVE_PUBLISHING_ENABLED: ${{ vars.LIVE_PUBLISHING_ENABLED }}
          DEFAULT_PUBLISH_PLATFORM: ${{ vars.DEFAULT_PUBLISH_PLATFORM }}
          MAX_DAILY_OPERATING_SPEND_USD: ${{ vars.MAX_DAILY_OPERATING_SPEND_USD }}
          MAX_MONTHLY_OPERATING_SPEND_USD: ${{ vars.MAX_MONTHLY_OPERATING_SPEND_USD }}
          BUFFER_ENABLED_MARCUS_VALE: ${{ vars.BUFFER_ENABLED_MARCUS_VALE }}
          BUFFER_ENABLED_NIA_BROOKS: ${{ vars.BUFFER_ENABLED_NIA_BROOKS }}
          BUFFER_ENABLED_CAMILLE_ROSE: ${{ vars.BUFFER_ENABLED_CAMILLE_ROSE }}
          BUFFER_ENABLED_MAYA_REYES: ${{ vars.BUFFER_ENABLED_MAYA_REYES }}
          BUFFER_API_KEY_MARCUS_VALE: ${{ secrets.BUFFER_API_KEY_MARCUS_VALE }}
          BUFFER_ORG_ID_MARCUS_VALE: ${{ vars.BUFFER_ORG_ID_MARCUS_VALE }}
          BUFFER_CHANNEL_MARCUS_VALE_INSTAGRAM: ${{ vars.BUFFER_CHANNEL_MARCUS_VALE_INSTAGRAM }}
          BUFFER_CHANNEL_MARCUS_VALE_THREADS: ${{ vars.BUFFER_CHANNEL_MARCUS_VALE_THREADS }}
          BUFFER_CHANNEL_MARCUS_VALE_X: ${{ vars.BUFFER_CHANNEL_MARCUS_VALE_X }}
          BUFFER_CHANNEL_MARCUS_VALE_TIKTOK: ${{ vars.BUFFER_CHANNEL_MARCUS_VALE_TIKTOK }}
          BUFFER_CHANNEL_MARCUS_VALE_YOUTUBE: ${{ vars.BUFFER_CHANNEL_MARCUS_VALE_YOUTUBE }}
          BUFFER_API_KEY_NIA_BROOKS: ${{ secrets.BUFFER_API_KEY_NIA_BROOKS }}
          BUFFER_ORG_ID_NIA_BROOKS: ${{ vars.BUFFER_ORG_ID_NIA_BROOKS }}
          BUFFER_CHANNEL_NIA_BROOKS_INSTAGRAM: ${{ vars.BUFFER_CHANNEL_NIA_BROOKS_INSTAGRAM }}
          BUFFER_CHANNEL_NIA_BROOKS_THREADS: ${{ vars.BUFFER_CHANNEL_NIA_BROOKS_THREADS }}
          BUFFER_CHANNEL_NIA_BROOKS_X: ${{ vars.BUFFER_CHANNEL_NIA_BROOKS_X }}
          BUFFER_CHANNEL_NIA_BROOKS_TIKTOK: ${{ vars.BUFFER_CHANNEL_NIA_BROOKS_TIKTOK }}
          BUFFER_CHANNEL_NIA_BROOKS_YOUTUBE: ${{ vars.BUFFER_CHANNEL_NIA_BROOKS_YOUTUBE }}
          BUFFER_API_KEY_CAMILLE_ROSE: ${{ secrets.BUFFER_API_KEY_CAMILLE_ROSE }}
          BUFFER_ORG_ID_CAMILLE_ROSE: ${{ vars.BUFFER_ORG_ID_CAMILLE_ROSE }}
          BUFFER_CHANNEL_CAMILLE_ROSE_INSTAGRAM: ${{ vars.BUFFER_CHANNEL_CAMILLE_ROSE_INSTAGRAM }}
          BUFFER_CHANNEL_CAMILLE_ROSE_THREADS: ${{ vars.BUFFER_CHANNEL_CAMILLE_ROSE_THREADS }}
          BUFFER_CHANNEL_CAMILLE_ROSE_X: ${{ vars.BUFFER_CHANNEL_CAMILLE_ROSE_X }}
          BUFFER_CHANNEL_CAMILLE_ROSE_TIKTOK: ${{ vars.BUFFER_CHANNEL_CAMILLE_ROSE_TIKTOK }}
          BUFFER_CHANNEL_CAMILLE_ROSE_YOUTUBE: ${{ vars.BUFFER_CHANNEL_CAMILLE_ROSE_YOUTUBE }}
          BUFFER_API_KEY_MAYA_REYES: ${{ secrets.BUFFER_API_KEY_MAYA_REYES }}
          BUFFER_ORG_ID_MAYA_REYES: ${{ vars.BUFFER_ORG_ID_MAYA_REYES }}
          BUFFER_CHANNEL_MAYA_REYES_INSTAGRAM: ${{ vars.BUFFER_CHANNEL_MAYA_REYES_INSTAGRAM }}
          BUFFER_CHANNEL_MAYA_REYES_THREADS: ${{ vars.BUFFER_CHANNEL_MAYA_REYES_THREADS }}
          BUFFER_CHANNEL_MAYA_REYES_X: ${{ vars.BUFFER_CHANNEL_MAYA_REYES_X }}
          BUFFER_CHANNEL_MAYA_REYES_TIKTOK: ${{ vars.BUFFER_CHANNEL_MAYA_REYES_TIKTOK }}
          BUFFER_CHANNEL_MAYA_REYES_YOUTUBE: ${{ vars.BUFFER_CHANNEL_MAYA_REYES_YOUTUBE }}
        run: node runtime/run.mjs
